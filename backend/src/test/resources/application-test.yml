spring:
  datasource:
    url: jdbc:h2:mem:bnrportal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: false

portal:
  tokens:
    secret: "test-secret-key-must-be-at-least-32-bytes-long!!"
  files:
    upload-dir: ${java.io.tmpdir}/bnr-upload-test
